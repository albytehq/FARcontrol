[package]
name = "frtrol"
version = "1.2.0"
edition = "2021"
description = "FARcontrol — approval-gated control plane for external AI agents (authentication ≠ authorization)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "time", "signal", "io-util", "sync"] }
axum = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
bs58 = "0.5"
base64 = "0.22"
ureq = { version = "2.12", features = ["json", "tls"] }
toml = "0.8"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
portable-pty = "0.8"
libc = "0.2"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }
argon2 = { version = "0.5", features = ["std"] }
comfy-table = "7"
owo-colors = "4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
